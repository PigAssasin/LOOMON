project_id = "pinterest-markers"

[api]
enabled = true
port = 54321
schemas = ["public", "catalog", "commerce", "agent", "wallet", "payments", "search", "notifications"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**"]

[storage]
enabled = true
file_size_limit = "20MiB"

[functions.send-order-reminders]
verify_jwt = false
