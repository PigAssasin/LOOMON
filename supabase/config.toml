project_id = "loomon"

[auth.web3.ethereum]
enabled = true

[api]
enabled = true
port = 54321
schemas = ["public", "catalog", "commerce", "customization", "agent", "wallet", "payments", "messaging", "search", "notifications"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://loomon.vercel.app"
additional_redirect_urls = [
  "https://loomon.vercel.app/**",
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
]

[storage]
enabled = true
file_size_limit = "20MiB"

[functions.send-order-reminders]
verify_jwt = false
